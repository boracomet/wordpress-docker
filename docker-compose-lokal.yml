# WordPress 7.1 + PHP 8.5 + MariaDB 12.3 LTS + Nginx + Redis – yerel geliştirme
# Traefik ve Let's Encrypt yok. Site adresi: http://localhost:8080
# (HTTP_PORT ile değiştirilebilir). DOMAIN zorunlu değildir.
# NOT: configs.content için Docker Compose >= 2.23 gerekir.
# NOT: İçerikteki "$$" = Compose'un $ değişken yorumlamasından kaçış. Elle düzenlerken bozma.
#
# Kaynak varsayılanları yerel makineye göredir (env ile override edilebilir):
# nginx tmpfs 256m, PHP_MAX_CHILDREN 8, DB_BUFFER_POOL 512M, REDIS_MAXMEMORY 256mb.
#
# Evrensel stack: docker-compose.yml
# Dokploy: docker-compose-dokploy.yml
# Aynı anda yalnızca bir varyant çalıştırın (name: wp, volume çakışması).

name: wp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - wp_data:/var/www/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    tmpfs:
      - /var/cache/nginx:size=256m
    depends_on: [wordpress]
    logging: *logging

  wordpress:
    # WordPress 7.1 + PHP 8.5 (resmi imaj) + phpredis eklentisi (Redis cache için hızlı istemci)
    build:
      dockerfile_inline: |
        FROM wordpress:php8.5-fpm-alpine
        COPY --from=ghcr.io/mlocati/php-extension-installer /usr/bin/install-php-extensions /usr/local/bin/
        RUN install-php-extensions redis
    image: wp-php85-redis:local
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-localpass}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', 'http://localhost:${HTTP_PORT:-8080}');
        define('WP_SITEURL', 'http://localhost:${HTTP_PORT:-8080}');
        define('WP_REDIS_HOST', 'redis');
        define('DISABLE_WP_CRON', true);
        define('WP_POST_REVISIONS', 5);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wp_data:/var/www/html
    configs:
      - source: php_ini
        target: /usr/local/etc/php/conf.d/zz-custom.ini
      - source: php_pool
        target: /usr/local/etc/php-fpm.d/zz-pool.conf
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

  # Gerçek cron: WP-Cron'u her dakika çalıştırır (trafiğe bağımlı değil)
  cron:
    image: wordpress:cli-php8.5
    restart: unless-stopped
    user: "82:82"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-localpass}
    volumes:
      - wp_data:/var/www/html
    entrypoint: ["/bin/sh", "-c", "while true; do wp cron event run --due-now --path=/var/www/html >/dev/null 2>&1 || true; sleep 60; done"]
    depends_on: [wordpress]
    logging: *logging

  mariadb:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wpuser}
      MARIADB_PASSWORD: ${DB_PASSWORD:-localpass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localroot}
    volumes:
      - db_data:/var/lib/mysql
    configs:
      - source: mariadb_cnf
        target: /etc/mysql/conf.d/tuning.cnf
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *logging

volumes:
  wp_data:
  db_data:

configs:
  nginx_conf:
    content: |
      fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WPCACHE:32m inactive=60m max_size=200m;
      fastcgi_cache_key "$$scheme$$request_method$$host$$request_uri";

      # wp-login.php brute-force koruması (ayrı zone, sunucu genelinde değil)
      limit_req_zone $$binary_remote_addr zone=wplogin:10m rate=10r/m;

      # Yerel veya isteğe bağlı bir reverse proxy arkasından gerçek ziyaretçi IP'si
      set_real_ip_from 10.0.0.0/8;
      set_real_ip_from 172.16.0.0/12;
      set_real_ip_from 192.168.0.0/16;
      real_ip_header CF-Connecting-IP;

      # Reverse proxy varsa https bilgisini PHP'ye ilet (yerelde düz HTTP de çalışır)
      map $$http_x_forwarded_proto $$fwd_https { default off; https on; }

      # Cache atlama kuralları
      map $$request_method $$skip_method { default 0; POST 1; }
      map $$http_cookie $$skip_cookie {
          default 0;
          ~*wordpress_logged_in 1;
          ~*comment_author 1;
          ~*wp-postpass 1;
          ~*woocommerce_items_in_cart 1;
          ~*woocommerce_cart_hash 1;
      }
      map $$request_uri $$skip_uri {
          default 0;
          ~*^/(wp-admin|wp-login\.php|wp-json|cart|checkout|my-account|xmlrpc\.php) 1;
      }

      gzip on;
      gzip_comp_level 5;
      gzip_vary on;
      gzip_min_length 512;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

      server {
          listen 80 default_server;
          server_name ${DOMAIN:-localhost};
          root /var/www/html;
          index index.php;
          client_max_body_size 64m;
          server_tokens off;

          open_file_cache max=10000 inactive=30s;
          open_file_cache_valid 60s;
          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 30;

          set $$skip_cache 0;
          if ($$skip_method)        { set $$skip_cache 1; }
          if ($$query_string != "") { set $$skip_cache 1; }
          if ($$skip_cookie)        { set $$skip_cache 1; }
          if ($$skip_uri)           { set $$skip_cache 1; }

          location / { try_files $$uri $$uri/ /index.php?$$args; }

          # /wp-login.php için hız sınırı (brute-force koruması). Exact match olduğu
          # için aşağıdaki \.php bloğundan önce değerlendirilir.
          location = /wp-login.php {
              limit_req zone=wplogin burst=10 nodelay;
              try_files $$uri =404;
              include fastcgi_params;
              fastcgi_pass wordpress:9000;
              fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
              fastcgi_param HTTPS $$fwd_https;
              fastcgi_read_timeout 60s;
          }

          location ~ \.php$$ {
              try_files $$uri =404;
              include fastcgi_params;
              fastcgi_pass wordpress:9000;
              fastcgi_index index.php;
              fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
              fastcgi_param HTTPS $$fwd_https;
              fastcgi_buffers 16 16k;
              fastcgi_buffer_size 32k;
              fastcgi_read_timeout 60s;

              fastcgi_cache WPCACHE;
              fastcgi_cache_valid 200 301 302 10m;
              fastcgi_cache_valid 404 1m;
              fastcgi_cache_revalidate on;
              fastcgi_cache_bypass $$skip_cache;
              fastcgi_no_cache $$skip_cache;
              fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
              fastcgi_cache_background_update on;
              fastcgi_cache_lock on;
              add_header X-Cache $$upstream_cache_status;
          }

          location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|mp4)$$ {
              expires 365d;
              add_header Cache-Control "public, immutable";
              access_log off;
              try_files $$uri =404;
          }

          location ~ /\.(?!well-known) { deny all; }
          location = /xmlrpc.php { deny all; }
      }

  php_ini:
    content: |
      memory_limit = 512M
      upload_max_filesize = 64M
      post_max_size = 64M
      max_execution_time = 60
      realpath_cache_size = 4M
      realpath_cache_ttl = 600
      opcache.enable = 1
      opcache.memory_consumption = 256
      opcache.interned_strings_buffer = 32
      opcache.max_accelerated_files = 30000
      opcache.validate_timestamps = 1
      opcache.revalidate_freq = 60
      opcache.jit = tracing
      opcache.jit_buffer_size = 64M

  php_pool:
    content: |
      [www]
      pm = dynamic
      pm.max_children = ${PHP_MAX_CHILDREN:-8}
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      pm.max_requests = 1000

  mariadb_cnf:
    content: |
      [mysqld]
      innodb_buffer_pool_size = ${DB_BUFFER_POOL:-512M}
      innodb_log_file_size = 1G
      innodb_flush_log_at_trx_commit = 2
      innodb_flush_method = O_DIRECT
      innodb_flush_neighbors = 0
      innodb_io_capacity = 2000
      innodb_io_capacity_max = 4000
      max_connections = 400
      thread_cache_size = 64
      table_open_cache = 4000
      tmp_table_size = 128M
      max_heap_table_size = 128M
      skip-name-resolve
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_520_ci
